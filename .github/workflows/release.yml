name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Assign an automatic version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="1.3.${RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate distribution formats and metadata
        run: python -m unittest discover -s tests -v
      - name: Build Unity, VPM and Blender packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/build_release.py --version "$VERSION"
      - name: Keep build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release, Git package and VCC index
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist/
      - name: Publish the versioned Git package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/publish.py package-git --staging dist/package --version "$VERSION" --source "$GITHUB_SHA"
      - name: Publish a complete release
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-state"; then
            if [ "$(cat "$RUNNER_TEMP/release-state")" = false ]; then
              echo "Release already published; preserving its assets."
              exit 0
            fi
          else
            cat > "$RUNNER_TEMP/notes.md" <<EOF
          Automatic build from source commit ${GITHUB_SHA}.

          - **VCC**: add https://raw.githubusercontent.com/${GH_REPO}/vpm/index.json
          - **Unity Package Manager**: Add package from git URL: https://github.com/${GH_REPO}.git#upm
          - **Unity asset package**: import Nyades-BlenderRoundTrip-${VERSION}.unitypackage
          - **Blender 4.2+**: install nyades_ft_toolkit-${VERSION}.zip from disk

          All distributions carry version ${VERSION}. The UPM installation includes an update notice and an Update via UPM button.
          EOF
            gh release create "$TAG" --verify-tag --draft --title "Blender Round Trip ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" dist/*.zip dist/*.unitypackage dist/package.json dist/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false
      - name: Make the new version available in VCC
        run: python scripts/publish.py listing --manifest dist/package.json
